name: haskell

on:
  push:
  pull_request:

jobs:
  stack-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libnetcdf-dev
      - uses: haskell/actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
      - name: Build doctor
        run: sh scripts/doctor.sh
      - name: Test
        run: stack --install-ghc test --no-terminal
